schema_version = "2.0"

[extension]
id = "com.open1s.computer-use"
name = "Computer Use"
version = "1.0.0"
description = "A real, opt-in screen, pointer and keyboard extension for macOS"
authors = ["BSH Example"]
license = "MIT"
repository = "https://github.com/open1s/bsh_extensions"
homepage = "https://github.com/open1s/bsh_extensions"

[compatibility]
host = ">=3.0.2, <5.0.0"
extension_api = "^1.0"

[runtime]
kind = "process"

[runtime.config]
args = ["server.py"]
entry = "python3"
protocol = "jsonrpc-2.0"
startup = "on-demand"

[capabilities]
required = [
    "process.execute",
    "computer.use",
    "agent.tools.register",
    "agent.prompts.provide",
    "agent.skills.provide",
    "agent.workflows.provide",
    "ui.panels",
    "ui.commands",
    "events.subscribe",
]

# Usage entries: 1 tool + 1 command + 1 panel = 3
[[contribution]]
kind = "tool"
id = "computer"

[contribution.payload]

[[contribution]]
kind = "command"
id = "refresh"

[contribution.payload]

[[contribution]]
kind = "panel"
id = "desktop"

[contribution.payload]

[[contribution]]
kind = "prompt"
id = "system"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "computer-safety"

[contribution.payload]

[[contribution]]
kind = "workflow"
id = "inspect"

[contribution.payload]

[[contribution]]
kind = "integration"
id = "desktop.control"

[contribution.payload]

[[contribution]]
kind = "integration"
id = "desktop.refresh"

[contribution.payload]

[[contribution]]
kind = "event.subscribe"
id = "session.created"

[contribution.payload]

[[contribution]]
kind = "event.subscribe"
id = "tool.completed"

[contribution.payload]

[resources]
max_memory_mb = 256
max_execution_ms = 15000
max_concurrent_calls = 1
max_output_bytes = 1048576

[dependencies]