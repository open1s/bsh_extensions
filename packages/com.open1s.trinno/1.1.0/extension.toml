schema_version = "2.0"

[extension]
id = "com.open1s.trinno"
name = "Trinno"
version = "1.1.0"
description = "AI-assisted literature research workflow for graduate students and early-career researchers: search OpenAlex and arXiv, ingest papers into note cards, and scaffold methodology and TRIZ/ARIZ innovation workspaces, guided by bundled research skills."
authors = ["open1s"]
license = "MIT"
repository = "https://github.com/open1s/bsh_extensions"
homepage = "https://github.com/open1s/bsh_extensions/tree/main/packages/com.open1s.trinno/1.1.0"

[compatibility]
host = ">=3.0.0, <5.0.0"
extension_api = "^1.0"

[runtime]
kind = "process"

[runtime.config]
startup = "on-demand"
entry = "python3"
protocol = "jsonrpc-2.0"
args = ["-B", "server.py"]

[runtime.config.env]
PYTHONDONTWRITEBYTECODE = "1"

[capabilities]
required = ["agent.tools.register", "process.execute", "network.http", "workspace.write", "workspace.read", "agent.skills.provide"]

[[contribution]]
kind = "tool"
id = "search_literature"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "intake_papers"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "init_project"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "research-workflow"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "research-methodology"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "ariz-triz"

[contribution.payload]

[resources]
max_memory_mb = 256
max_execution_ms = 600000
max_output_bytes = 262144

[dependencies]

[services]
provides = []
requires = []
