schema_version = "2.0"

[extension]
id = "com.open1s.trinno"
name = "Trinno"
version = "1.1.0"
description = "AI-assisted literature research workflow for graduate students and early-career researchers: search OpenAlex and arXiv (keyless) into a reading list, ingest local papers (PDF/BibTeX text extraction plus OpenAlex metadata completion) into per-paper note card skeletons, and scaffold a methodology workspace (protocol, PRISMA screening log, quality appraisal, reproducibility checklist) plus a TRIZ/ARIZ-85C innovation workspace; LLM analysis (gap analysis, systematic innovation, proposal drafting) is done by the BSH agent guided by bundled research-workflow, research-methodology and ariz-triz skills, not by the tools."
authors = ["BSH Extension Author"]
license = "MIT"

[compatibility]
host = ">=3.0.0, <5.0.0"
extension_api = "^1.0"

[runtime]
kind = "process"

[runtime.config]
startup = "on-demand"
entry = "python3"
protocol = "jsonrpc-2.0"
args = ["-B", "server.py"]

[runtime.config.env]
PYTHONDONTWRITEBYTECODE = "1"

[capabilities]
required = ["agent.tools.register", "process.execute", "network.http", "workspace.write", "workspace.read", "agent.skills.provide"]

[[contribution]]
kind = "tool"
id = "search_literature"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "intake_papers"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "init_project"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "analyze_gaps"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "research-workflow"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "research-methodology"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "ariz-triz"

[contribution.payload]

[resources]
max_memory_mb = 256
max_execution_ms = 600000
max_output_bytes = 262144

[dependencies]

[services]
provides = []
requires = []
