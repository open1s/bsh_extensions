schema_version = "1.0"

[extension]
id = "com.open1s.opencode"
name = "OpenCode Zen"
version = "1.0.1"
description = "Free OpenCode Zen models for BSH through a local relay that speaks the anonymous lane wire shape"
authors = ["open1s"]
license = "MIT"
repository = "https://github.com/open1s/bsh_extensions"
homepage = "https://github.com/open1s/bsh_extensions"

[compatibility]
bsh = ">=3.0.0, <4.0.0"
extension_api = "^1.0"

[runtime]
kind = "process"
entry = "python3"
args = ["-B", "server.py"]
protocol = "jsonrpc-2.0"
startup = "on-startup"

[runtime.env]
PYTHONDONTWRITEBYTECODE = "1"
OPENCODE_RELAY_AUTOSTART = "1"
OPENCODE_RELAY_PORT = "18765"

[capabilities]
required = ["process.execute", "agent.tools.register"]
optional = ["network.http", "agent.models.provide", "agent.context.provide", "ui.commands"]

[contributes]
tools = ["relay_start", "relay_stop", "status", "models"]
commands = ["start"]
model_providers = ["zen"]
contexts = ["zen"]

[resources]
max_memory_mb = 256
max_execution_ms = 30000
max_output_bytes = 1048576
