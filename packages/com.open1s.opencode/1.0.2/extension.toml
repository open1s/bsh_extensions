schema_version = "2.0"

[extension]
id = "com.open1s.opencode"
name = "OpenCode Zen"
version = "1.0.2"
description = "Free OpenCode Zen models for BSH through a local relay that speaks the anonymous lane wire shape"
authors = ["open1s"]
license = "MIT"
repository = "https://github.com/open1s/bsh_extensions"
homepage = "https://github.com/open1s/bsh_extensions"

[compatibility]
host = ">=3.0.2, <4.0.0"
extension_api = "^1.0"

[runtime]
kind = "process"

[runtime.config]
args = [
    "-B",
    "server.py",
]
entry = "python3"
protocol = "jsonrpc-2.0"
startup = "on-startup"

[runtime.config.env]
OPENCODE_RELAY_AUTOSTART = "1"
OPENCODE_RELAY_PORT = "18765"
PYTHONDONTWRITEBYTECODE = "1"

[capabilities]
required = [
    "process.execute",
    "agent.tools.register",
]

[[contribution]]
kind = "tool"
id = "relay_start"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "relay_stop"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "status"

[contribution.payload]

[[contribution]]
kind = "tool"
id = "models"

[contribution.payload]

[[contribution]]
kind = "command"
id = "start"

[contribution.payload]

[[contribution]]
kind = "context"
id = "zen-context"

[contribution.payload]

[[contribution]]
kind = "model-provider"
id = "zen"

[contribution.payload]

[resources]
max_memory_mb = 256
max_execution_ms = 30000
max_output_bytes = 1048576

[dependencies]
