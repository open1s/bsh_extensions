schema_version = "2.0"

[extension]
id = "com.open1s.extdev"
name = "Extension DevKit"
version = "2.1.0"
description = "Design and ship BSH extensions from inside BSH: a domain-first blueprint, a validating scaffold, a manifest compiler, a review with stable rule ids, a dry run of every declared tool, deterministic archives and a Git market index editor. Commands and skills guide a specific extension for a specific domain, and grill-me interrogates an ambiguous brief before code is written."
authors = ["open1s"]
license = "MIT"
repository = "https://github.com/open1s/bsh_extensions"
homepage = "https://github.com/open1s/bsh_extensions/tree/main/packages/com.open1s.extdev/2.1.0"

[compatibility]
host = ">=3.0.2, <5.0.0"
extension_api = "^1.0"

[runtime]
kind = "process"

[runtime.config]
entry = "python3"
args = ["-B", "server.py"]
protocol = "jsonrpc-2.0"
startup = "on-demand"

[runtime.config.env]
PYTHONDONTWRITEBYTECODE = "1"

[capabilities]
required = [
    "process.execute",
    "agent.tools.register",
    "agent.context.provide",
    "agent.prompts.provide",
    "agent.skills.provide",
    "agent.workflows.provide",
    "ui.panels",
    "ui.commands",
    "events.subscribe",
]

# Usage entries: 1 tool + 1 command + 1 panel = 3
[[contribution]]
kind = "tool"
id = "design"

[contribution.payload]

[[contribution]]
kind = "command"
id = "publish"

[contribution.payload]

[[contribution]]
kind = "panel"
id = "workshop"

[contribution.payload]

[[contribution]]
kind = "prompt"
id = "extdev-guide"

[contribution.payload]

[[contribution]]
kind = "context"
id = "extensions"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "extdev"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "extdev-design"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "extdev-build"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "extdev-ship"

[contribution.payload]

[[contribution]]
kind = "skill"
id = "grill-me"

[contribution.payload]

[[contribution]]
kind = "event.subscribe"
id = "extension.loaded"

[contribution.payload]

[[contribution]]
kind = "event.subscribe"
id = "extension.failed"

[contribution.payload]

[[contribution]]
kind = "event.subscribe"
id = "tool.completed"

[contribution.payload]

[[contribution]]
kind = "event.subscribe"
id = "config.changed"

[contribution.payload]

[configuration]
schema = "schemas/config.schema.json"

[configuration.defaults]
author = "BSH Extension Author"
license = "MIT"
default_runtime = "declarative"
market_path = ""
smoke_timeout_ms = 5000
strict_lint = false
default_domain = ""

[resources]
max_memory_mb = 256
max_execution_ms = 30000
max_concurrent_calls = 4
max_output_bytes = 1048576

[dependencies]

[services]
provides = []
requires = []