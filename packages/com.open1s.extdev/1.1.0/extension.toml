schema_version = "2.0"

[extension]
id = "com.open1s.extdev"
name = "Extension DevKit"
version = "1.1.0"
description = "Design and ship BSH extensions from inside BSH: a domain-first blueprint, a validating scaffold, a manifest compiler, a review with stable rule ids, a dry run of every declared tool, deterministic archives and a Git market index editor. Commands and skills guide a specific extension for a specific domain."
authors = ["open1s"]
license = "MIT"
repository = "https://github.com/open1s/bsh_extensions"
homepage = "https://github.com/open1s/bsh_extensions/tree/main/packages/com.open1s.extdev/1.1.0"

[compatibility]
host = ">=3.0.2, <4.0.0"
extension_api = "^1.0"

[runtime]
kind = "process"

[runtime.config]
entry = "python3"
args = ["-B", "server.py"]
protocol = "jsonrpc-2.0"
startup = "on-demand"

[runtime.config.env]
PYTHONDONTWRITEBYTECODE = "1"

[capabilities]
required = [
    "process.execute",
    "agent.tools.register",
    "agent.context.provide",
    "agent.prompts.provide",
    "agent.skills.provide",
    "agent.workflows.provide",
    "ui.panels",
    "ui.commands",
    "events.subscribe",
]

